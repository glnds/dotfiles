[settings]
idiomatic_version_file_enable_tools = ["node", "python"]
not_found_auto_install = true
minimum_release_age = "7d"
# hk: packslip's latest-lookup only checks the newest release vs the age gate, so a <7d hk
# release makes hk=latest hard-fail install. Exempting keeps latest self-updating.
minimum_release_age_excludes = ["claude", "codex", "hk"]

[tools]
node = "26"
"npm:@earendil-works/pi-coding-agent" = "0.85.1"
"npm:typescript" = "latest"
"npm:typescript-language-server" = "latest"
rust = "1.98.1"

[env]
UV_SYSTEM_CERTS = "1"
